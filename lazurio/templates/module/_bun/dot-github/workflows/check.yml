name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/v1
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: {{bun_version}}
      - run: test "$(bun --version)" = "{{bun_version}}"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
