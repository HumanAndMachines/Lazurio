<!doctype html>
<html lang="cs" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lazurio Launchpad</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="../favicon-dark.svg" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="../favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="../settings.css" />
    <link rel="stylesheet" href="../setup.css" />
    <link rel="stylesheet" href="../ssh-access.css" />
  </head>
  <body class="settings-page">
    <header class="settings-topbar" role="banner">
      <a class="settings-back" href="../" data-i18n="settings.back"></a>
      <nav class="settings-crumbs" data-i18n-aria-label="settings.crumbsLabel">
        <span data-i18n="settings.title"></span>
        <span class="settings-crumb-separator" aria-hidden="true">/</span>
        <span id="settingsCrumb" aria-current="page"></span>
      </nav>
    </header>

    <div class="settings-shell">
      <nav class="settings-nav" data-i18n-aria-label="settings.navLabel">
        <a class="settings-nav-item" href="general" data-section="general">
          <!-- iconoir/settings -->
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke-width="1.5" aria-hidden="true">
            <path d="M12 15C13.6569 15 15 13.6569 15 12C15 10.3431 13.6569 9 12 9C10.3431 9 9 10.3431 9 12C9 13.6569 10.3431 15 12 15Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M19.6224 10.3954L18.5247 7.7448L20 6L18 4L16.2647 5.48295L13.5578 4.36974L12.9353 2H10.981L10.3491 4.40113L7.70441 5.51596L6 4L4 6L5.45337 7.78885L4.3725 10.4463L2 11V13L4.40111 13.6555L5.51575 16.2997L4 18L6 20L7.79116 18.5403L10.397 19.6123L11 22H13L13.6045 19.6132L16.2551 18.5155C16.6969 18.8313 18 20 18 20L20 18L18.5159 16.2494L19.6139 13.598L21.9999 12.9772L22 11L19.6224 10.3954Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span data-i18n="settings.nav.general"></span>
        </a>
        <a class="settings-nav-item" href="github" data-section="github">
          <!-- iconoir/github -->
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke-width="1.5" aria-hidden="true">
            <path d="M16 22.0268V19.1568C16.0375 18.68 15.9731 18.2006 15.8109 17.7506C15.6487 17.3006 15.3925 16.8902 15.06 16.5468C18.2 16.1968 21.5 15.0068 21.5 9.54679C21.4997 8.15062 20.9627 6.80799 20 5.79679C20.4558 4.5753 20.4236 3.22514 19.91 2.02679C19.91 2.02679 18.73 1.67679 16 3.50679C13.708 2.88561 11.292 2.88561 9 3.50679C6.27 1.67679 5.09 2.02679 5.09 2.02679C4.57638 3.22514 4.54414 4.5753 5 5.79679C4.03013 6.81549 3.49252 8.17026 3.5 9.57679C3.5 14.9968 6.8 16.1868 9.94 16.5768C9.611 16.9168 9.35726 17.3222 9.19531 17.7667C9.03335 18.2112 8.96681 18.6849 9 19.1568V22.0268" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M9 20.0267C6 20.9999 3.5 20.0267 2 17.0267" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span data-i18n="settings.nav.github"></span>
        </a>
        <a class="settings-nav-item" href="ssh" data-section="ssh" hidden>
          <!-- iconoir/terminal -->
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke-width="1.5" aria-hidden="true">
            <path d="M5 7L9 10.5L5 14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M11 14H15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M2 21V3H22V21H2Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span data-i18n="settings.nav.ssh"></span>
        </a>
      </nav>

      <main class="settings-main" id="settingsMain">
        <section class="settings-section" data-section="general" aria-labelledby="settingsGeneralTitle">
          <h1 id="settingsGeneralTitle" data-i18n="settings.nav.general"></h1>
          <p class="settings-intro" data-i18n="settings.general.intro"></p>
          <section class="settings-group" aria-labelledby="settingsEnvironmentTitle">
            <h2 id="settingsEnvironmentTitle" class="settings-group-title" data-i18n="settings.environment.title"></h2>
            <div id="settingsEnvironment" class="settings-rows" aria-live="polite"></div>
          </section>
          <section class="settings-group" aria-labelledby="settingsDisplayTitle">
            <h2 id="settingsDisplayTitle" class="settings-group-title" data-i18n="settings.display.title"></h2>
            <div class="settings-rows">
              <label class="settings-row" for="settingsLanguage">
                <span class="settings-row-copy">
                  <span class="settings-row-label" data-i18n="locale.label"></span>
                  <span class="settings-row-help" data-i18n="settings.language.help"></span>
                </span>
                <select id="settingsLanguage" class="settings-select"></select>
              </label>
            </div>
          </section>
        </section>

        <section class="settings-section" data-section="github" aria-labelledby="settingsGitHubTitle" hidden>
          <h1 id="settingsGitHubTitle" data-i18n="settings.github.title"></h1>
          <p class="settings-intro" data-i18n="setup.github.intro"></p>

          <section class="setup-card" aria-labelledby="setupGitHubStatusTitle">
            <h2 id="setupGitHubStatusTitle" data-i18n="setup.github.statusTitle"></h2>
            <dl id="setupGitHubStatus" class="setup-status" aria-live="polite"></dl>
            <p id="setupGitHubNotice" class="setup-notice" role="status" hidden></p>
            <label class="setup-organization">
              <span data-i18n="setup.github.organizationLabel"></span>
              <input id="setupGitHubOrganization" type="text" list="setupGitHubOrganizations" autocomplete="off" spellcheck="false" data-i18n-placeholder="setup.github.organizationPlaceholder" />
              <datalist id="setupGitHubOrganizations"></datalist>
            </label>
            <div class="setup-actions">
              <button id="setupGitHubStart" type="button" class="btn btn-primary" data-i18n="setup.github.start" hidden></button>
              <button id="setupGitHubRefresh" type="button" class="btn btn-secondary" data-i18n="setup.github.refresh"></button>
            </div>
          </section>

          <section id="setupGitHubSession" class="setup-card" aria-labelledby="setupGitHubSessionTitle" hidden>
            <h2 id="setupGitHubSessionTitle" data-i18n="setup.github.sessionTitle"></h2>
            <ol id="setupGitHubSteps" class="setup-steps" aria-live="polite"></ol>
            <div id="setupGitHubDevice" class="setup-device" hidden>
              <p data-i18n="setup.github.deviceHint"></p>
              <p class="setup-code-row">
                <code id="setupGitHubCode" class="setup-code"></code>
              </p>
              <p><a id="setupGitHubDeviceLink" class="btn btn-primary btn-sm" target="_blank" rel="noopener noreferrer" data-i18n="setup.github.openGitHub"></a></p>
              <p id="setupGitHubExpiry" class="setup-muted"></p>
            </div>
            <p id="setupGitHubSessionResult" class="setup-notice" role="status" hidden></p>
            <div class="setup-actions">
              <button id="setupGitHubCancel" type="button" class="btn btn-secondary btn-sm" data-i18n="setup.github.cancel" hidden></button>
            </div>
          </section>

          <section id="setupGitHubNext" class="setup-card" aria-labelledby="setupGitHubNextTitle" hidden>
            <h2 id="setupGitHubNextTitle" data-i18n="setup.github.nextTitle"></h2>
            <p class="setup-muted" data-i18n="setup.github.nextHint"></p>
            <div class="setup-actions">
              <button id="setupGitHubUpdate" type="button" class="btn btn-secondary" data-i18n="setup.github.update"></button>
              <button id="setupGitHubInstall" type="button" class="btn btn-primary" hidden></button>
            </div>
            <p id="setupGitHubNextResult" class="setup-notice" role="status" hidden></p>
          </section>
        </section>

        <section class="settings-section" data-section="ssh" aria-labelledby="settingsSshTitle" hidden>
          <h1 id="settingsSshTitle" data-i18n="ssh.title"></h1>
          <p class="settings-intro" data-i18n="settings.ssh.direction"></p>
          <div id="settingsSshStep"></div>
        </section>
      </main>
    </div>
    <script type="module" src="../settings.js"></script>
  </body>
</html>
