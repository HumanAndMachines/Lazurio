# CI checks sdíleného frameworku: stejné gates, jaké běží lokálně
# (`bun run check` = Launchpad discovery check + testy; Guide build).
# Release/binárková pipeline je samostatná práce (CAC-0054, task-2026-07-16-002).
name: checks

on:
  pull_request:
  push:
    branches: [main]

# Superseded běhy rušíme jen u PR (šetří runnery při rychlém přepushování).
# U PR seskupujeme podle čísla PR, takže se ruší jen starší běhy téhož PR;
# číslo PR je unikátní i mezi fork PR se stejným názvem větve (public repo).
# Push do main nemá pull_request.number → fallback na unikátní run_id, takže
# každý commit na sdíleném main dostane vlastní skupinu, nikdy se nekoalescuje
# ani neruší a zůstane po něm dokončený CI záznam.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Public repo: CI token drží least-privilege — joby jen čtou obsah.
permissions:
  contents: read

# Akce pinujeme na immutable commit SHA (supply-chain hardening na public repu:
# přesunutý tag ani kompromitovaný upstream účet nespustí cizí kód v CI).
# Komentář za SHA drží lidsky čitelnou verzi pro budoucí bumpy.
jobs:
  checks:
    name: bun run check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Exact verzi čte ze stejné package autority jako CLI a Doctor.
          bun-version-file: lazurio/package.json
      - name: Instalace deklarované Lazurio exact-search závislosti
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ripgrep
      - name: Instalace deklarované Lazurio exact-search závislosti (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($attempt in 1..3) {
            choco install ripgrep --yes --no-progress
            if (Get-Command rg -ErrorAction SilentlyContinue) {
              rg --version
              exit 0
            }
            if ($attempt -lt 3) {
              Write-Warning "Chocolatey nepublikoval rg (pokus $attempt/3); opakuji standardní instalaci."
              Start-Sleep -Seconds (5 * $attempt)
            }
          }
          throw 'Chocolatey po třech pokusech nezpřístupnil příkaz rg.'
      - name: Launchpad discovery check + testy
        run: bun run check

  guide-build:
    name: guide app build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: lazurio/package.json
      - name: Instalace závislostí Guide
        working-directory: guide/app/v1
        run: bun install --frozen-lockfile
      - name: Build Guide
        working-directory: guide/app/v1
        run: bun run build

  npm-package:
    name: npm package gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: lazurio/package.json
      - name: Pack + globální instalace + smoke přes skutečný npm tarball
        run: bun run npm-package:gate
