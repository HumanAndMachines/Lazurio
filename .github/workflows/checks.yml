# CI checks sdíleného frameworku: stejné gates, jaké běží lokálně
# (`bun run check` = Launchpad discovery check + testy; Guide build).
# Release/binárková pipeline je samostatná práce (CAC-0054, task-2026-07-16-002).
name: checks

on:
  pull_request:
  push:
    branches: [main]

# Superseded běhy rušíme jen u PR (šetří runnery při rychlém přepushování).
# U PR seskupujeme podle čísla PR, takže se ruší jen starší běhy téhož PR;
# číslo PR je unikátní i mezi fork PR se stejným názvem větve (public repo).
# Push do main nemá pull_request.number → fallback na unikátní run_id, takže
# každý commit na sdíleném main dostane vlastní skupinu, nikdy se nekoalescuje
# ani neruší a zůstane po něm dokončený CI záznam.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Public repo: CI token drží least-privilege — joby jen čtou obsah.
permissions:
  contents: read

# Akce pinujeme na immutable commit SHA (supply-chain hardening na public repu:
# přesunutý tag ani kompromitovaný upstream účet nespustí cizí kód v CI).
# Komentář za SHA drží lidsky čitelnou verzi pro budoucí bumpy.
jobs:
  checks:
    name: bun run check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Exact verzi čte ze stejné package autority jako CLI a Doctor.
          bun-version-file: lazurio/package.json
      - name: Instalace deklarované Lazurio exact-search závislosti
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ripgrep
      - name: Instalace deklarované Lazurio exact-search závislosti (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Pin the upstream binary and checksum; public Chocolatey outages
          # must not prevent the declared dependency from reaching the tests.
          $archive = Join-Path $env:RUNNER_TEMP 'ripgrep-15.2.0.zip'
          $installRoot = Join-Path $env:RUNNER_TEMP 'lazurio-ci-ripgrep'
          Invoke-WebRequest -Uri 'https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/ripgrep-15.2.0-x86_64-pc-windows-msvc.zip' -OutFile $archive
          $expected = '71b2fef860abe467217a538ff31de02f5258807c0129f771846f87bd029aafc5'
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Upstream ripgrep archive checksum mismatch.'
          }
          Expand-Archive -Path $archive -DestinationPath $installRoot -Force
          $bin = Join-Path $installRoot 'ripgrep-15.2.0-x86_64-pc-windows-msvc'
          & (Join-Path $bin 'rg.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'Pinned ripgrep did not execute successfully.' }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Launchpad discovery check + testy
        run: bun run check
      - name: Diagnose failed Windows process identity probe
        if: failure() && runner.os == 'Windows'
        timeout-minutes: 2
        shell: pwsh
        run: |
          @'
          import { execFileSync } from "node:child_process";
          import { windowsModuleLockProcessIdentityCommand } from "./lazurio/runtime/module-runtime-lock-lib.mjs";
          const command = windowsModuleLockProcessIdentityCommand(process.pid);
          const started = Date.now();
          const child = Bun.spawn(command, { stdout: "pipe", stderr: "pipe", windowsHide: true });
          const timer = setTimeout(() => child.kill(), 20000);
          try {
            const [exit, stdout, stderr] = await Promise.all([child.exited, new Response(child.stdout).text(), new Response(child.stderr).text()]);
            console.log(JSON.stringify({ probe: "bun", elapsed_ms: Date.now() - started, exit, stdout: stdout.slice(0, 500), stderr: stderr.slice(0, 500) }));
          } finally { clearTimeout(timer); }
          const next = Date.now();
          try {
            const stdout = execFileSync(command[0], command.slice(1), { encoding: "utf8", timeout: 20000, windowsHide: true });
            console.log(JSON.stringify({ probe: "node-api", elapsed_ms: Date.now() - next, stdout: stdout.slice(0, 500) }));
          } catch (error) {
            console.log(JSON.stringify({ probe: "node-api", elapsed_ms: Date.now() - next, code: error.code, signal: error.signal }));
          }
          '@ | Set-Content -Encoding utf8 diagnose-process-identity.mjs
          bun diagnose-process-identity.mjs

  guide-build:
    name: guide app build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: lazurio/package.json
      - name: Instalace závislostí Guide
        working-directory: guide/app/v1
        run: bun install --frozen-lockfile
      - name: Build Guide
        working-directory: guide/app/v1
        run: bun run build

  npm-package:
    name: npm package gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: lazurio/package.json
      - name: Pack + globální instalace + smoke přes skutečný npm tarball
        run: bun run npm-package:gate
